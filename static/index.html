<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <!-- KaTeX is vendored, not fetched from a CDN, so math renders offline too. -->
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-head">
        <button class="new-chat" id="new-chat" title="Start a new chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </header>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search chats" autocomplete="off" />
      </div>

      <nav class="chat-list" id="chat-list" aria-label="Conversations"></nav>

      <footer class="sidebar-foot">
        <span class="model-dot" id="model-dot"></span>
        <span class="model-name" id="model-name">connecting…</span>
        <button class="icon-btn guards-btn" id="guards-btn" hidden
                title="Policy guards" aria-label="Policy guards">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6l7-3Z"/></svg>
        </button>
      </footer>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="chat-title" id="chat-title">Chat</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="retitle-btn" title="Regenerate title with the model" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="rename-btn" title="Rename chat" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger" id="delete-btn" title="Delete chat" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="composer-wrap">
        <div class="banner" id="banner" hidden></div>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Send a message…"
                    autocomplete="off" autofocus></textarea>
          <button type="submit" class="send" id="send" title="Send (Enter)" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
          <button type="button" class="send stop" id="stop" title="Stop generating" aria-label="Stop" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          </button>
        </form>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </div>
    </main>
  </div>

  <!-- Policy guards: CRUD over the policies the m mitm proxy is enforcing. -->
  <dialog class="sheet" id="guards" aria-labelledby="guards-title">
    <header class="sheet-head">
      <div class="sheet-heading">
        <h2 id="guards-title">Policy guards</h2>
        <p class="sheet-sub" id="guards-sub"></p>
      </div>
      <button class="icon-btn" id="guards-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-banner" id="guards-banner" hidden></div>
    <div class="sheet-body" id="guards-body"></div>
    <footer class="sheet-foot" id="guards-foot"></footer>
  </dialog>

  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/math.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
